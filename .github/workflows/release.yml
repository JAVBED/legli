name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test launcher
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm legli.spec
      - name: Check executable
        run: .\dist\legli.exe help
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "dist/legli.exe#legli.exe" --target "${{ github.sha }}" --title "legli build ${{ github.run_number }}" --generate-notes
